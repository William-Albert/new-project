<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深眠 DeepSleep · 让每一个夜晚都值得期待</title>
<style>
  :root{--paper:#f8f6f2;--ink:#16130f;--dim:#6e675e;--accent:#3f6f63;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);overflow-x:hidden;}
  
  /* 基础排版，维持正常感 */
  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;padding:18px 28px;background:rgba(248,246,242,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(0,0,0,.05)}
  .logo{font-weight:700;letter-spacing:.1em;font-size:1.02rem}
  .navlinks{display:flex;gap:30px;font-size:.88rem;opacity:.85}
  .navbtn{border:1px solid var(--ink);border-radius:100px;padding:8px 20px;font-size:.82rem;background:none;cursor:pointer;color:inherit}
  
  .hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:150px 24px 110px}
  .badge{display:inline-flex;align-items:center;gap:9px;font-size:.75rem;letter-spacing:.15em;color:var(--accent);border:1px solid rgba(63,111,99,.28);border-radius:100px;padding:7px 18px;margin-bottom:40px}
  .badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dot 2s infinite}
  @keyframes dot{0%,100%{opacity:.3}50%{opacity:1}}
  .hero h1{font-size:clamp(2.6rem,7vw,5rem);line-height:1.1;letter-spacing:-.03em}
  .hero h1 em{font-style:normal;color:var(--accent)}
  .hero .sub{margin-top:30px;font-size:1.1rem;line-height:1.9;color:var(--dim);max-width:40ch}
  .btn{margin-top:40px;padding:16px 40px;border:none;border-radius:100px;background:var(--ink);color:var(--paper);font-size:1rem;cursor:pointer}
  
  /* 伪装用的正常区块 */
  .features{background:#efece6;padding:100px 28px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;max-width:1080px;margin:0 auto}
  .card{background:#fff;border-radius:20px;padding:40px 32px;box-shadow:0 10px 30px -15px rgba(0,0,0,.1)}
  .card h3{margin-bottom:12px;font-size:1.1rem}
  .card p{font-size:.92rem;line-height:1.8;color:var(--dim)}

  /* ================= 恐怖特效层 ================= */
  
  /* 12秒后的全屏抖动反色 */
  body.glitch {
    animation: shake 0.15s infinite;
    filter: invert(1) contrast(2) grayscale(0.5);
    overflow: hidden;
  }
  @keyframes shake {
    0% { transform: translate(2px, 2px) rotate(0.5deg); }
    20% { transform: translate(-3px, 0px) rotate(-1deg); }
    40% { transform: translate(1px, -2px) rotate(0deg); }
    60% { transform: translate(-1px, 3px) rotate(1deg); }
    80% { transform: translate(3px, -1px) rotate(-0.5deg); }
    100% { transform: translate(-2px, 1px) rotate(0deg); }
  }

  /* 红色错误弹窗 */
  #warning {
    position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
    z-index: 500; background: #000; color: #ff2a2a; border: 2px solid #ff2a2a;
    padding: 20px 30px; font-family: monospace; text-align: center;
    box-shadow: 0 0 50px rgba(255,0,0,0.5);
    display: none; pointer-events: none;
  }
  #warning.on { display: block; animation: warningBlink 0.5s infinite; }
  @keyframes warningBlink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* 跳脸层 */
  #scare {
    position: fixed; inset: 0; z-index: 9999; background: #000;
    display: none; align-items: center; justify-content: center;
  }
  #scare.on { display: flex; }
  #scare svg {
    width: 120vw; height: 120vh; /* 故意超出屏幕 */
    object-fit: cover;
    animation: zoomIn 0.1s cubic-bezier(0,1,0,1) forwards, glitchFace 0.05s infinite;
  }
  @keyframes zoomIn { from{transform:scale(0.5)} to{transform:scale(1)} }
  @keyframes glitchFace {
    0% { transform: translate(-5px, 0) scale(1.05); filter: contrast(2) hue-rotate(0deg); }
    50% { transform: translate(5px, 0) scale(1); filter: contrast(3) hue-rotate(90deg); }
    100% { transform: translate(0, 5px) scale(1.02); filter: contrast(2) hue-rotate(-45deg); }
  }

  /* 最终黑屏结算 */
  #endScreen {
    position: fixed; inset: 0; z-index: 10000; background: #000;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #b33; font-family: monospace; text-align: center; padding: 20px;
  }
  #endScreen.on { display: flex; }
  .stat-line { font-size: 1.2rem; margin: 10px 0; opacity: 0; animation: fadeUp 1s forwards; }
  .big-text { font-size: 2rem; color: #fff; margin-top: 40px; letter-spacing: 0.2em; opacity: 0; animation: fadeUp 1s forwards; animation-delay: 2s;}
  
  @keyframes fadeUp { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

</style>
</head>
<body>

<nav>
  <a class="logo" href="#">◐ 深眠</a>
  <div class="navlinks"><a href="#">产品</a><a href="#">科学</a><a href="#">评价</a></div>
  <button class="navbtn" onclick="triggerScare()">免费体验</button>
</nav>

<section class="hero">
  <div class="badge">临床验证 · 无需药物</div>
  <h1>让每一个夜晚<br>都值得<em>期待</em></h1>
  <p class="sub">基于十二年睡眠科学的 AI 助眠系统。<br>超过 200 万个夜晚，在我们这里安然度过。</p>
  <button class="btn" onclick="triggerScare()">开始你的第一晚</button>
</section>

<section class="features">
  <div class="cards">
    <div class="card"><h3>智能监测</h3><p>实时追踪 42 项生理指标，为你生成每晚的睡眠结构图。</p></div>
    <div class="card"><h3>声音引导</h3><p>根据呼吸频率实时生成专属音景，在 15 分钟内自然入睡。</p></div>
    <div class="card"><h3>梦境记录</h3><p>醒来后自动生成梦境报告，了解你的潜意识状态。</p></div>
  </div>
</section>

<!-- 恐怖元素 -->
<div id="warning">
  > 系统异常<br>> 正在尝试连接用户 #0000 的后台数据...
</div>

<div id="scare">
  <!-- 极度恐怖的鬼脸 SVG -->
  <svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
    <rect width="1000" height="1000" fill="#050000"/>
    <!-- 扭曲的脸颊 -->
    <path d="M200,400 Q500,100 800,400 Q900,700 700,950 Q500,1100 300,950 Q100,700 200,400 Z" fill="#c4b5a5" filter="url(#blur)"/>
    <!-- 深邃的黑眼眶 -->
    <circle cx="350" cy="450" r="90" fill="#000"/>
    <circle cx="650" cy="450" r="90" fill="#000"/>
    <!-- 渗血的瞳孔 -->
    <circle cx="350" cy="450" r="15" fill="#f00" filter="url(#glow)"/>
    <circle cx="650" cy="450" r="15" fill="#f00" filter="url(#glow)"/>
    <!-- 裂开的恐怖嘴巴 -->
    <path d="M350,700 Q500,600 650,700 Q500,900 350,700 Z" fill="#000"/>
    <path d="M400,680 L450,850 L500,690 L550,850 L600,680" fill="none" stroke="#fff" stroke-width="15"/>
    <!-- 阴影 -->
    <path d="M250,500 Q500,400 750,500 Q500,800 250,500 Z" fill="rgba(0,0,0,0.5)"/>
    <defs>
      <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
      <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
    </defs>
  </svg>
</div>

<div id="endScreen">
  <div class="stat-line" style="animation-delay:0.5s">连接已断开。</div>
  <div class="stat-line" style="animation-delay:1.2s" id="timeText"></div>
  <div class="stat-line" style="animation-delay:1.9s">后台数据已同步。</div>
  <div class="big-text">晚安。</div>
  <button class="btn" style="margin-top:50px; background:#222; color:#888; opacity:0; animation:fadeUp 1s forwards; animation-delay:3s" onclick="location.reload()">重新进入</button>
</div>

<script>
  let startTime = Date.now();
  let hasScared = false;
  let audioCtx = null;

  // 初始化音频上下文（必须由用户交互触发）
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  document.addEventListener('click', initAudio);
  document.addEventListener('scroll', initAudio);
  document.addEventListener('touchstart', initAudio);

  // 极其刺耳的合成音效
  function playScareSound() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    
    // 1. 白噪声爆炸
    const bufferSize = audioCtx.sampleRate * 2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.8, t);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 1.5);
    noise.connect(noiseGain).connect(audioCtx.destination);
    noise.start(t);

    // 2. 低频下坠尖啸
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(800, t);
    osc.frequency.exponentialRampToValueAtTime(50, t + 1.2);
    const oscGain = audioCtx.createGain();
    oscGain.gain.setValueAtTime(0.5, t);
    oscGain.gain.exponentialRampToValueAtTime(0.01, t + 1.2);
    osc.connect(oscGain).connect(audioCtx.destination);
    osc.start(t);
  }

  // 触发恐怖流程
  function triggerScare() {
    if (hasScared) return;
    hasScared = true;

    // 1. 播放尖啸
    playScareSound();

    // 2. 全屏鬼脸糊脸
    document.getElementById('scare').classList.add('on');

    // 3. 结束后进入黑屏结算
    setTimeout(() => {
      document.getElementById('scare').classList.remove('on');
      const endScreen = document.getElementById('endScreen');
      endScreen.classList.add('on');
      
      // 计算真实停留时间
      let seconds = Math.floor((Date.now() - startTime) / 1000);
      document.getElementById('timeText').innerText = `你的停留时间：${seconds} 秒`;
    }, 1600); // 鬼脸持续1.6秒
  }

  // ================= 被动触发机制（防不胜防） =================
  
  // 8秒：弹出红色警告
  setTimeout(() => {
    document.getElementById('warning').classList.add('on');
  }, 8000);

  // 11秒：网页开始剧烈抽搐、反色
  setTimeout(() => {
    document.body.classList.add('glitch');
  }, 11000);

  // 14秒：直接跳脸
  setTimeout(() => {
    document.body.classList.remove('glitch'); // 取消抖动，防止鬼脸跟着抖
    triggerScare();
  }, 14000);

  // 如果用户在这期间手贱点了任何按钮，立刻触发
</script>

</body>
</html>
